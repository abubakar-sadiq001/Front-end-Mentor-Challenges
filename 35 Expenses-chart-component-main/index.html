<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>expenses-chart-component-main</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/imgs/favicon-32x32.png" type="image/x-icon">
    <script defer src="script.js"></script>
</head>
<body>
    <main>
        <div class="container">
            <header>
                <div class="header-contenets">
                    <div class="left">
                        <p>My balance</p>
                        <h1>$921.48</h1>
                    </div>
                    <div class="right">
                        <img src="assets/imgs/logo.svg" alt="myLogo" class="logo">
                    </div>
                </div>
            </header>
            <div class="wrapper">
                <h1>Spending - Last 7 days</h1>
                <div class="chart-zone">
                    <div class="charts">
                        <div class="lines monday">
                            <div class="all m-price">$17.45</div>
                        </div>
                        <div class="lines tuesday">
                            <div class="all t-price">$34.91</div>
                        </div>
                        <div class="lines wedenesday">
                            <div class="all w-price">$52.36</div>
                        </div>
                        <div class="lines thursday">
                            <div class="all thu-price">$31.07</div>
                        </div>
                        <div class="lines friday">
                            <div class="all f-price">$23.39</div>
                        </div>
                        <div class="lines sartuday">
                            <div class="all s-price">$43.28</div>
                        </div>
                        <div class="lines sunday">
                            <div class="all sun-price">$25.48</div>
                        </div>
                    </div>
                    <div class="days-wrapper">
                        <p>mon</p>
                        <p>tue</p>
                        <p>wed</p>
                        <p>thu</p>
                        <p>fri</p>
                        <p>sat</p>
                        <p>sun</p>
                    </div>
                </div>
                <hr>
                 <!-- <div class="hr"></div> -->
                <!--  -->
                <div class="footer">
                    <!--  -->
                    <div class="total-price-wrapper">
                        <p>Total this month</p>
                        <span>$478.33</span>
                    </div>
                    <div class="percent-wrapper">
                        <p id="percent">+2.4%</p>
                        <p id="sub-head">from last month</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>

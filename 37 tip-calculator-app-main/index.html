<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tip-calculator-app-main</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/images/favicon-32x32.png" type="image/x-icon">
    <!-- Linking to Media query file -->
     <link rel="stylesheet" href="media.query.css">
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alata&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Faculty+Glyphic&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Manrope:wght@200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="logo-wrapper">
            <img src="assets/images/logo.svg" class="logo">
        </div>
        <div class="container">
            <div class="contents">
                <div class="input-side">
                    <label for="bill" class="bill-label">Bill</label>
                    <input type="number" id="bill" class="inputBill" placeholder="0"><br>

                    <!-- Percentages -->
                     <label for="percent">Select Tip %</label>
                     <div class="percentages">
                        <div class="allPercent five">5%</div>
                        <div class="allPercent ten">10%</div>
                        <div class="allPercent fifteen">15%</div>
                        <div class="allPercent twentyfive">25%</div>
                        <div class="allPercent fifty">50%</div>
                        <input class="allPercent custom" type="number" placeholder="custom">
                     </div>

                     <!-- Nums of folks -->
                      <div class="inline">
                        <label for="folksNumber">Number of People</label>
                        <p class="err-msg">Can't be zero</p>
                      </div>
                      <input type="number" id="folksNumber" class="inputPeople" placeholder="0" value="1">
                </div>
                <div class="result-wrapper">
                    <div class="result-content">
                        <div class="tip-amount-row">
                            <div id="first-row">
                                <h3>Tip Amount</h3>
                                <p>/ person</p>
                            </div>
                            <h1 class="tip-amount">$0.00</h1>
                        </div>
                        <div class="total-amount-row">
                            <div class="second-row">
                                <h3>Total</h3>
                                <p>/ person</p>
                            </div>
                            <h1 class="total-amount">$0.00</h1>
                        </div>
                        <button id="reset">RESET</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
